<section id="calculator" style="background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);">
  <div class="wrap center">
    <div class="eyebrow reveal" data-t="calc_eyebrow"></div>
    <h2 class="reveal" data-t="calc_title"></h2>
    <p class="lead reveal" data-t="calc_sub"></p>
    <p class="reveal" style="margin-top:14px"><a class="pill-link" href="calculator.html" data-where="calc_full_top" data-t="calc_full"></a></p>
  </div>
  <div class="wrap">
    <div class="calc reveal">
      <div class="panel" style="background: var(--bg); box-shadow: none;">
        <div class="presets">
          <span data-t="c_try"></span>
          <button class="chip on" type="button" data-preset="good" data-t="c_p_good"></button>
          <button class="chip" type="button" data-preset="bad" data-t="c_p_bad"></button>
          <button class="chip" type="button" data-preset="zero" data-t="c_p_zero"></button>
        </div>
        <div class="step">
          <div class="num">1</div>
          <div>
            <h4 data-t="c_s1"></h4><p class="hint" data-t="c_s1_hint"></p>
            <div class="row">
              <div><label for="n0" data-t="c_shares"></label><input id="n0" type="number" min="1" step="1" value="100"></div>
              <div><label for="p0" data-t="c_price"></label><input id="p0" type="number" min="0" step="0.01" value="100"></div>
            </div>
          </div>
        </div>
        <div class="step">
          <div class="num">2</div>
          <div>
            <h4 data-t="c_s2"></h4><p class="hint" data-t="c_s2_hint"></p>
            <div id="rounds"></div>
            <button class="add" id="add" type="button" data-t="c_add"></button>
          </div>
        </div>
        <div class="step">
          <div class="num">3</div>
          <div>
            <h4 data-t="c_s3"></h4><p class="hint" data-t="c_s3_hint"></p>
            <div class="row"><div><input id="now" type="number" min="0" step="0.01" value="110" aria-label="price now"></div><div></div></div>
          </div>
        </div>
      </div>
      <div class="panel result" id="calc-result" aria-live="polite">
        <h3 data-t="c_result"></h3>
        <div class="compare">
          <div><small data-t="c_ibkr"></small><strong id="r_ibkr"></strong><em id="r_ibkr_pct"></em></div>
          <div class="real"><small data-t="c_real"></small><strong id="r_real"></strong><em id="r_real_pct"></em></div>
        </div>
        <div class="bars">
          <label data-t="c_ibkr"></label><div class="bar"><i id="b_ibkr" style="background: var(--muted)"></i></div>
          <label data-t="c_real"></label><div class="bar"><i id="b_real" style="background: var(--accent)"></i></div>
        </div>
        <div class="say" id="r_say"></div>
        <div class="fine" data-t="c_fine"></div>
        <div class="cta-row"><a class="btn btn-primary app-link" href="https://truecost.streamlit.app" data-t="c_cta"></a>
          <a class="btn btn-ghost" href="calculator.html" data-where="calc_full" data-t="calc_full_btn"></a></div>
      </div>
    </div>
  </div>
</section>

for (const l of ["en", "zh"]) Object.assign(T[l], CT[l]);
const APP = "https://truecost.streamlit.app";
const forced = new URLSearchParams(location.search).get("theme");  // ?theme=light for screenshots
if (forced === "light") document.documentElement.dataset.theme = "light";
let lang = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "zh" || q === "en") return q;
  try { const s = localStorage.getItem("tc-lang"); if (s) return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
})();

function fill(s, vars) { return s.replace(/\{(\w+)\}/g, (_, k) => vars[k]); }

function render() {
  const d = T[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = d[el.dataset.t];
    if (v === undefined) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".app-link").forEach(a => a.href = `${APP}/?lang=${lang}&src=site`);
  document.getElementById("lang").textContent = lang === "zh" ? "English" : "中文";
  document.title = lang === "zh" ? "TrueCost — 用本币看清你在 IBKR 的真实盈亏" : "TrueCost — your real IBKR profit, in your own currency";
  calc();
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("tc-lang", lang); } catch (e) {}
  render();
  tcTrack("lang_switch", { to: lang });
});


/* ---------- motion ---------- */
const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in");
    e.target.querySelectorAll(".count").forEach(countUp);
    io.unobserve(e.target);
  });
}, { threshold: 0.12 }) : null;
document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in"));
if (!io) document.querySelectorAll(".count").forEach(c => c.textContent = c.dataset.prefix + Number(c.dataset.to).toLocaleString("en-AU"));

function countUp(el) {
  const to = Number(el.dataset.to), pre = el.dataset.prefix;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = pre + to.toLocaleString("en-AU"); return; }
  const t0 = performance.now(), dur = 1200;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = pre + Math.round(to * e).toLocaleString("en-AU");
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

initReview();
render();
