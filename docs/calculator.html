<script>
const T = {
  en: {
    nav_home: "← TrueCost home", nav_cta: "Try TrueCost free",

    mode_plan: "Before: buy-back price", mode_review: "After: real cost",

    p_shares: "Shares", p_cost: "Cost per share",
    p_s2: "What you plan to sell", p_s2_hint: "How many shares you'll sell, and at what price.",
    p_qty: "Shares to sell", p_sell: "Sell price",

    fee_own: "A round trip is two orders: {fee} in total.",
    p_be: "Buy back below this to come out ahead",
    be_say: "Selling {q} at {s} and paying {fees} in commission, you need to buy back below {be} — {gap} ({gapPct}) under your sell price.",
    be_none: "Enter the shares and price you plan to sell.",
    p_if: "If you buy back at", p_gain: "This round", p_newcost: "Your new cost",
    gain_pct: "after {fees} commission", cost_pct: "{diff} vs {c} now",
    p_table: "At different buy-back prices", p_th_b: "Buy back at", p_th_gain: "This round", p_th_cost: "New cost",
    t_up: "price rose", t_be: "break-even",
    p_target: "Want your cost down to…",
    tgt_ok: "Buy back at {b} or lower ({pct} vs your sell price).",
    tgt_no: "Not possible in one round with {q} shares — sell more, or plan several rounds.",
    tgt_above: "That's above your current cost — any buy-back under {be} already gets you there.",
    risk: "If the price keeps rising instead: buying back at {up} (+5%) lifts your cost to {cost}. Not buying back leaves you with {left} shares.",
    p_fine: "Real cost = money still in the position ÷ shares held. Ignores taxes and currency. A calculator, not advice on whether to trade.",
    end_title: "What did your shares really cost?",
    end_sub: "Upload your IBKR statement for your real cost per stock, how much came from trading vs the exchange rate, and what fees took — in your home currency. The full round-by-round scorecard is part of Pro.",
    end_cta: "Try it with your statement — free",
    foot: "For calculation only. Not financial or investment advice.",
    foot_seller: "TrueCost is run by an Australian sole trader · ABN 19 534 467 524", foot_refund: "Founding-member presale: full refund if Pro hasn’t launched by 31 Mar 2027; refunds on request before then.", foot_contact: "truecost.help@gmail.com",
  },
  zh: {
    nav_home: "← TrueCost 首页", nav_cta: "免费试用 TrueCost",
    eyebrow: "免费 · 不用注册 · 任何股票都能用",
    title: "做 T 计算器",
    sub: "卖出之前：算好扣掉佣金后，买回价要低于多少才真正降成本。做完之后：对比 IBKR 显示的成本和你的真实成本。",
    mode_plan: "做 T 前：算买回价", mode_review: "做完后：算真实成本",
    p_s1: "现在的持仓", p_s1_hint: "持有股数和每股成本，用 IBKR 显示的或你自己算的都行，任何币种。",
    p_shares: "持有股数", p_cost: "每股成本",
    p_s2: "这次打算卖出", p_s2_hint: "准备卖多少股、卖什么价。",
    p_qty: "卖出股数", p_sell: "卖出价",
    p_s3: "每笔佣金",
    fee_auto: "留空则按 IBKR 美股固定佣金估算：每笔 {fee}（每股 0.005，最低 1）。一卖一买共两笔。",
    fee_own: "一卖一买共两笔，合计 {fee}。",
    p_be: "买回价低于这个数才不亏",
    be_say: "在 {s} 卖出 {q} 股、佣金共 {fees}，买回价要低于 {be}，也就是比卖出价低 {gap}（{gapPct}）。",
    be_none: "先填打算卖出的股数和价格。",
    p_if: "如果买回价是", p_gain: "这一轮", p_newcost: "买回后的新成本",
    gain_pct: "已扣佣金 {fees}", cost_pct: "比现在的 {c} {diff}",
    p_table: "不同买回价的结果", p_th_b: "买回价", p_th_gain: "这一轮", p_th_cost: "新成本",
    t_up: "涨了才买回", t_be: "保本",
    p_target: "想把成本降到……",
    tgt_ok: "买回价要在 {b} 或以下（比卖出价 {pct}）。",
    tgt_no: "卖 {q} 股做一轮做不到——多卖一些，或者分几轮。",
    tgt_above: "这比现在的成本还高——只要在 {be} 以下买回就已经达到了。",
    risk: "如果卖了之后股价继续涨：在 {up}（+5%）买回，成本会升到 {cost}；不买回的话，你手里只剩 {left} 股。",
    p_fine: "真实成本 = 仍投在这只股票里的钱 ÷ 持有股数。未计税和汇率。这只是计算工具，不建议你是否交易。",
    end_title: "你的股票到底多少钱买的？",
    end_sub: "上传 IBKR 对账单，看每只股票的真实成本、交易和汇率各赚了多少、佣金花了多少，全部换算成你的本币。逐轮的完整做 T 成绩单属于专业版。",
    end_cta: "上传对账单试试——免费",
    foot: "仅供计算参考，不构成财务或投资建议。",
    foot_seller: "TrueCost 由澳大利亚个体经营者运营 · ABN 19 534 467 524", foot_refund: "创始会员预售：如 Pro 未在 2027-03-31 前上线，全额退款；上线前也可随时申请退款。", foot_contact: "联系：truecost.help@gmail.com",
  },
};
for (const l of ["en", "zh"]) Object.assign(T[l], CT[l]);

const APP = "app";  // the web app, docs/app/
let lang = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "zh" || q === "en") return q;
  try { const s = localStorage.getItem("tc-lang"); if (s) return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
})();
function fill(s, vars) { return s.replace(/\{(\w+)\}/g, (_, k) => vars[k]); }
const $ = id => document.getElementById(id);
const signed = v => (v >= 0 ? "+" : "−") + fmt(Math.abs(v));

/* ---------- before the trade ---------- */
let buyBack = null;       // null = follow the default (5% under the sell price)
function ibkrFee(q, price) { return Math.min(Math.max(1, 0.005 * q), 0.01 * q * price); }

function plan() {
  const d = T[lang];
  const n = Math.max(0, num($("h_n").value)), c = Math.max(0, num($("h_c").value));
  const q = Math.min(Math.max(0, num($("s_q").value)), n), s = Math.max(0, num($("s_p").value));
  const own = $("fee").value.trim() !== "";
  const fee = own ? Math.max(0, num($("fee").value)) : ibkrFee(q, s);
  const fees = 2 * fee;
  $("fee").placeholder = fmt(fee);
  $("fee_hint").textContent = fill(own ? d.fee_own : d.fee_auto, { fee: fmt(own ? fees : fee) });
  if (!q || !s || !n) {
    $("be").textContent = "—"; $("be_say").textContent = d.be_none; return;
  }
  // a round trip of q shares sold at s and bought back at b moves q·(s−b) − fees out of the position
  const gainAt = b => q * (s - b) - fees;
  const costAt = b => (n * c - gainAt(b)) / n;
  const be = s - fees / q;
  $("be").textContent = fmt(be);
  $("be_say").textContent = fill(d.be_say, { q: q.toLocaleString(), s: fmt(s), fees: fmt(fees), be: fmt(be),
                                              gap: fmt(s - be), gapPct: ((be / s - 1) * 100).toFixed(2) + "%" });

  const lo = +(s * 0.8).toFixed(2), hi = +(s * 1.1).toFixed(2);
  if (buyBack === null) buyBack = +(s * 0.95).toFixed(2);
  const rng = $("b_rng");
  rng.min = lo; rng.max = hi; rng.value = Math.min(Math.max(buyBack, lo), hi);
  if (document.activeElement !== $("b_in")) $("b_in").value = buyBack.toFixed(2);
  const g = gainAt(buyBack), nc = costAt(buyBack);
  $("gain").textContent = signed(g);
  $("gain").className = g >= 0 ? "pos" : "neg";
  $("gain_pct").textContent = fill(d.gain_pct, { fees: fmt(fees) });
  $("newcost").textContent = nc <= 0 ? d.c_zero : fmt(nc);
  $("newcost").className = nc < c ? "pos" : nc > c ? "neg" : "";
  $("newcost_pct").textContent = fill(d.cost_pct, { c: fmt(c), diff: c ? pct(nc / c - 1) : "—" });

  const levels = [[0.03, d.t_up], [null, d.t_be], [-0.01], [-0.02], [-0.03], [-0.05], [-0.08], [-0.1]];
  $("rows").innerHTML = levels.map(([k, tag]) => {
    const b = k === null ? be : s * (1 + k);
    const gg = gainAt(b), cc = costAt(b);
    const label = k === null ? "" : ` <span class="tag">${pct(k)}</span>`;
    const sel = Math.abs(b - buyBack) < 0.005 ? ' class="sel"' : "";
    return `<tr data-b="${b.toFixed(2)}"${sel}><td>${fmt(b)}${label}${tag ? ` <span class="tag">${tag}</span>` : ""}</td>
      <td class="${gg >= 0 ? "pos" : "neg"}">${signed(gg)}</td><td>${cc <= 0 ? d.c_zero : fmt(cc)}</td></tr>`;
  }).join("");

  // target cost → the highest buy-back price that reaches it
  if (document.activeElement !== $("tgt") && !$("tgt").dataset.touched) $("tgt").value = (c * 0.97).toFixed(2);
  const t = num($("tgt").value);
  const bt = s - (n * (c - t) + fees) / q;
  $("tgt_say").textContent = t >= c ? fill(d.tgt_above, { be: fmt(be) })
    : bt <= 0 ? fill(d.tgt_no, { q: q.toLocaleString() })
    : fill(d.tgt_ok, { b: fmt(bt), pct: pct(bt / s - 1) });

  $("risk").textContent = fill(d.risk, { up: fmt(s * 1.05), cost: fmt(costAt(s * 1.05)), left: (n - q).toLocaleString() });
}

function planEdited() { plan(); tcTrack("calc_use", { mode: "plan" }, true); }
["h_n", "h_c", "s_q", "s_p", "fee"].forEach(id => $(id).addEventListener("input", () => {
  if (id === "s_p") buyBack = null;    // a new sell price resets the buy-back to 5% under it
  planEdited();
}));
$("b_rng").addEventListener("input", e => { buyBack = num(e.target.value); planEdited(); });
$("b_in").addEventListener("input", e => { buyBack = num(e.target.value); planEdited(); });
$("tgt").addEventListener("input", () => { $("tgt").dataset.touched = "1"; planEdited(); });
$("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  buyBack = num(tr.dataset.b); $("b_in").value = tr.dataset.b; planEdited();
});

/* ---------- modes, language ---------- */
function setMode(m, track) {
  $("plan").classList.toggle("hidden", m !== "plan");
  $("review").classList.toggle("hidden", m !== "review");
  document.querySelectorAll("[data-mode]").forEach(b => {
    b.classList.toggle("on", b.dataset.mode === m); b.setAttribute("aria-selected", b.dataset.mode === m);
  });
  history.replaceState(null, "", "#" + m);
  if (track) tcTrack("calc_mode", { mode: m });
}
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode, true)));

function render() {
  const d = T[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-t]").forEach(el => { const v = d[el.dataset.t]; if (v !== undefined) el.textContent = v; });
  document.querySelectorAll(".app-link").forEach(a => a.href = `${APP}/?lang=${lang}&src=calculator`);
  $("lang").textContent = lang === "zh" ? "English" : "中文";
  document.title = lang === "zh" ? "做 T 计算器：保本买回价、做 T 后真实成本 | TrueCost"
                                 : "Round-trip calculator: break-even buy-back price & real cost | TrueCost";
  plan(); calc();
}
$("lang").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("tc-lang", lang); } catch (e) {}
  render();
  tcTrack("lang_switch", { to: lang });
});

initReview();
setMode(location.hash === "#review" ? "review" : "plan", false);
render();
</script>
</body>
</html>
